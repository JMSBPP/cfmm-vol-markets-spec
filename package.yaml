name:                cfmm-vol-markets-spec
version:             0.1.0.0
github:              "d2p-finance/cfmm-vol-markets-spec"
license:             BSD-3-Clause
author:              "JMSBPP"
maintainer:          "juan.serranotmf@gmail.com"
copyright:           "2026 JMSBPP"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Haskell twin of cfmm-vol-markets-spec (spec reference for vol-instruments on CFMMs). See <https://github.com/d2p-finance/cfmm-vol-markets-spec#readme>

# Package-level deps are the PURE numeric core only.  Chart/Chart-cairo/colour
# belong to the `plot` internal library alone -- see the note on `library:` below.
dependencies:
- base >= 4.7 && < 5
- mwc-random
- vector

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

# The public library is plot-free: depending on `cfmm-vol-markets-spec` must not
# drag in cairo/pango.  Downstream consumers (e.g. evm-spec-bridge, which reaches
# this package for bit-packing and tick math over JSON-RPC) compile none of the
# plotting stack.  Chart lives in the `plot` internal library, which is visible
# to this package's own exe and test suite but not to `build-depends` outside it.
library:
  source-dirs: src
  exposed-modules:
  - Greeks.Delta
  - Greeks.Gamma
  - Greeks.Theta
  - Greeks.Vega
  - Hedge.Ledger
  - Lib
  - Liquidity.LiquidityChunk
  - Liquidity.LiquidityDensity
  - Liquidity.LiquidityGrid
  - Liquidity.TickLiquidity
  - OptionRatio
  - Panoptic.Binning
  - Panoptic.LegChunk
  - Panoptic.MintPlan
  - Panoptic.NId
  - Payoffs.CashSecuredPut
  - Payoffs.CLMMPosition
  - Payoffs.CoveredCall
  - Payoffs.Forward
  - Payoffs.HolderPath
  - Payoffs.LadderPosition
  - Payoffs.Linear
  - Payoffs.Log
  - Payoffs.LvrRate
  - Payoffs.PathAccrual
  - Payoffs.Payoff
  - Payoffs.RangeAccrualNote
  - Payoffs.ReplicaDelta
  - Payoffs.Return
  - Payoffs.Savings
  - Payoffs.Swap
  - Payoffs.TransactionalFeeCapture
  - Payoffs.TransactionalReturn
  - Payoffs.VariancePortfolio
  - Payoffs.VolatilityCall
  - Payoffs.VolatilityReplica
  - Pricing.AdaptiveStremia
  - Pricing.ExpectedReturn
  - Pricing.FeeStructure
  - Pricing.InterestPriceMap
  - Pricing.InterestSqrt
  - Pricing.MarkUpStructure
  - Pricing.PriceDeformation
  - Pricing.Stremia
  - SqrtGrid
  - State
  - StrikeX96
  - TargetVega
  - TickPath
  - Trading.KappaCoordinate
  - Trading.PriceImpact
  - Trading.Quote
  - Volatility.ExpectedVolatility
  - Volatility.ImpliedVolatility
  - Volatility.TickVolatility
  - Volatility.VolatilityGrid
  - Volatility.VolOrder
  - Volatility.VolTermStructure
  other-modules: []

internal-libraries:
  hevm-adapter:
    source-dirs: src
    exposed-modules:
    - HevmSqrtGrid
    other-modules:
    - HevmExec
    dependencies:
    - cfmm-vol-markets-spec
    - bytestring
    - containers
    - generic-lens
    - hevm == 0.58.0
    - lens
    - text
    - vector
  plot:
    source-dirs: plot
    dependencies:
    - cfmm-vol-markets-spec
    - Chart
    - Chart-cairo
    - colour

executables:
  hevm-tickmath-peer:
    main:                Main.hs
    source-dirs:         app/HevmTickMathPeer
    ghc-options:
    - -threaded
    - -rtsopts
    dependencies:
    - cfmm-vol-markets-spec
    - cfmm-vol-markets-spec:hevm-adapter
    - aeson
    - bytestring
    - containers
    - filepath
    - hevm == 0.58.0
    - network
    - scientific
    - text
  cfmm-vol-markets-spec-exe:
    main:                Main.hs
    source-dirs:         app
    other-modules: []
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - cfmm-vol-markets-spec
    - cfmm-vol-markets-spec:plot
    - directory

tests:
  hevm-adapter-test:
    main:                HevmTickMathAdapterSpec.hs
    source-dirs:         test
    other-modules: []
    dependencies:
    - cfmm-vol-markets-spec
    - cfmm-vol-markets-spec:hevm-adapter
    - bytestring
    - containers
    - filepath
    - hevm == 0.58.0
    - text
  cfmm-vol-markets-spec-test:
    main:                Spec.hs
    source-dirs:         test
    other-modules: []
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    # Spec is one long IO script; pedantic CI would drown in shadowing/defaulting.
    - -Wno-name-shadowing
    - -Wno-type-defaults
    - -Wno-gadt-mono-local-binds
    dependencies:
    - cfmm-vol-markets-spec
    - cfmm-vol-markets-spec:plot
    # Spec.hs builds Layouts inline to exercise the panel helpers.
    - Chart
