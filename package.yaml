name:                cfmm-scratchpad
version:             0.1.0.0
github:              "d2p-finance/cfmm-vol-markets-spec"
license:             BSD-3-Clause
author:              "JMSBPP"
maintainer:          "juan.serranotmf@gmail.com"
copyright:           "2026 JMSBPP"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Haskell twin of cfmm-vol-markets-spec (spec reference for vol-instruments on CFMMs). See <https://github.com/d2p-finance/cfmm-vol-markets-spec#readme>

dependencies:
- base >= 4.7 && < 5
- Chart
- Chart-cairo
- colour
- mwc-random
- vector

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  cfmm-scratchpad-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - cfmm-scratchpad
    - directory

tests:
  cfmm-scratchpad-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    # Spec is one long IO script; pedantic CI would drown in shadowing/defaulting.
    - -Wno-name-shadowing
    - -Wno-type-defaults
    - -Wno-gadt-mono-local-binds
    dependencies:
    - cfmm-scratchpad
