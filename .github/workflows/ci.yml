name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A force-push cancels the superseded run (the lake build alone is ~7 min); least-privilege token.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  # Push / PR gate for the nested Foundry TickMath scaffold (Phase 1).
  # Requires recursive submodule init so Uniswap/v4-core@v4.0.0 and its
  # forge-std / OZ / solmate dependency chain are present before `forge build`.
  forge:
    name: submodule init + forge build (evm/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Assert exact Foundry dependency pins
        run: |
          v4_core_expected=e50237c43811bd9b526eff40f26772152a42daba
          seaport_expected=e9c5a9f17cb5ee658ccc9cb1a8eeab02c1f5a4cd
          forge_std_expected=620536fa5277db4e3fd46772d5cbc1ea0696fb43

          v4_core_actual="$(git -C evm/lib/v4-core rev-parse HEAD)"
          seaport_actual="$(git -C evm/lib/seaport rev-parse HEAD)"
          forge_std_actual="$(git -C evm/lib/forge-std rev-parse HEAD)"
          echo "v4-core HEAD=$v4_core_actual"
          echo "seaport HEAD=$seaport_actual"
          echo "forge-std HEAD=$forge_std_actual"

          test "$v4_core_actual" = "$v4_core_expected"
          test "$seaport_actual" = "$seaport_expected"
          test "$forge_std_actual" = "$forge_std_expected"

          grep -q 'v4-core/=lib/v4-core/' evm/remappings.txt
          grep -q '@seaport/=lib/seaport/test/foundry/' evm/remappings.txt
          grep -q 'forge-std/=lib/forge-std/src/' evm/remappings.txt
          grep -A 4 '"lib/v4-core"' evm/foundry.lock | grep -q "$v4_core_expected"
          grep -A 4 '"lib/seaport"' evm/foundry.lock | grep -q '"name": "1.6"'
          grep -A 4 '"lib/seaport"' evm/foundry.lock | grep -q "$seaport_expected"
          grep -A 4 '"lib/forge-std"' evm/foundry.lock | grep -q '"name": "v1.16.1"'
          grep -A 4 '"lib/forge-std"' evm/foundry.lock | grep -q "$forge_std_expected"

      - name: forge build
        run: forge build --root evm

      - name: Assert HevmDiffTest remains intentionally RED
        run: |
          set +e
          out="$(forge test --root evm --match-contract HevmDiffTest -vv 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"

          if [ "$rc" -eq 0 ]; then
            echo "::error::HevmDiffTest unexpectedly passed; Phase 2 requires the HEVM seam to remain RED"
            exit 1
          fi

          if ! printf '%s\n' "$out" | grep -q 'hevm.call not wired'; then
            echo "::error::HevmDiffTest failed for a cause other than the expected HEVM stub"
            exit 1
          fi

  stack:
    name: stack build && stack test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cairo (Chart-cairo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libglib2.0-dev pkg-config

      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock', 'package.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: stack build
        run: stack build --pedantic

      - name: stack test
        # Spec is a long IO script with intentional reuse; keep build pedantic.
        run: stack test

  lean:
    name: lake build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (toolchain pinned by ./lean-toolchain)
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build (no sorry/admit)
        # Mathlib oleans via `lake exe cache get` only; .lake/packages (~7 GB) is deliberately
        # NOT cached with actions/cache (10 GB repo cap would evict the Stack cache).
        # The sorry-guard reads Lean's own compiler warning, so our modules must compile fresh.
        run: |
          lake exe cache get
          out="$(lake build 2>&1)"; echo "$out"
          if echo "$out" | grep -qE "declaration uses '(sorry|admit)'"; then
            echo "::error::Lean proof uses sorry/admit"; exit 1
          fi
          echo "lean: lake build clean, no sorry/admit"
