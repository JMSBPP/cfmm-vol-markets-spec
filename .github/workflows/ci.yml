name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A force-push cancels the superseded run (the lake build alone is ~7 min); least-privilege token.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  stack:
    name: stack build && stack test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cairo (Chart-cairo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libglib2.0-dev pkg-config

      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock', 'package.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: stack build
        run: stack build --pedantic

      - name: stack test
        # Spec is a long IO script with intentional reuse; keep build pedantic.
        run: stack test

  lean:
    name: lake build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (toolchain pinned by ./lean-toolchain)
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build (no sorry/admit)
        # Mathlib oleans via `lake exe cache get` only; .lake/packages (~7 GB) is deliberately
        # NOT cached with actions/cache (10 GB repo cap would evict the Stack cache).
        # The sorry-guard reads Lean's own compiler warning, so our modules must compile fresh.
        run: |
          lake exe cache get
          out="$(lake build 2>&1)"; echo "$out"
          if echo "$out" | grep -qE "declaration uses '(sorry|admit)'"; then
            echo "::error::Lean proof uses sorry/admit"; exit 1
          fi
          echo "lean: lake build clean, no sorry/admit"
